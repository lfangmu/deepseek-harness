name: Build DSH Desktop

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@latest

      - name: Install root dependencies
        run: pnpm install
        working-directory: .

      - name: Build library
        run: npm run build:lib
        working-directory: .

      - name: Build web frontend
        run: pnpm run build:web
        working-directory: .

      - name: Install Electron dependencies
        run: npm install
        working-directory: launcher/electron-app-v2

      - name: Copy web assets
        run: |
          New-Item -ItemType Directory -Path "launcher/electron-app-v2/dist" -Force | Out-Null
          Copy-Item -Path "apps/web/dist/*" -Destination "launcher/electron-app-v2/dist/" -Recurse -Force

      - name: Build Windows installer
        run: npx electron-builder --win --x64
        working-directory: launcher/electron-app-v2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Windows-x64
          path: launcher/dist-electron/*.exe
          retention-days: 30
