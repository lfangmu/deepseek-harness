name: Build DSH Desktop

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install root dependencies
        run: pnpm install
        working-directory: .

      - name: Build web frontend
        run: pnpm run build:web
        working-directory: .

      - name: Install Electron dependencies
        run: npm install
        working-directory: launcher/electron-app-v2

      - name: Copy web assets
        run: |
          New-Item -ItemType Directory -Path "launcher/electron-app-v2/dist" -Force | Out-Null
          Copy-Item -Path "apps/web/dist/*" -Destination "launcher/electron-app-v2/dist/" -Recurse -Force
          # Create a simple 1x1 PNG icon
          \ = [byte[]](137,80,78,71,13,10,26,10,0,0,0,13,73,72,68,82,0,0,0,1,0,0,0,1,1,0,0,0,0,87,115,98,112,0,0,0,0,0,0,0,0,112,69,99,71,114,97,104,112,0,0,0,0,73,68,65,84,18,225,1,125,0,0,0,0,32,10,242,84,0,0,0,0,73,69,78,68,174,66,96,130)
          [System.IO.File]::WriteAllBytes("launcher/electron-app-v2/dist/icon.png", \)

      - name: Build Windows installer
        run: npx electron-builder --win --x64
        working-directory: launcher/electron-app-v2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-Windows-x64
          path: launcher/electron-app-v2/dist-electron/*.exe
          retention-days: 30